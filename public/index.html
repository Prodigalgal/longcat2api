<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LongCat2API 管理台</title>
  <style>
    :root { color-scheme: light; --ink:#17211b; --muted:#69736d; --line:#d8ddd9; --paper:#fff; --wash:#f3f5f3; --green:#16794b; --red:#b42318; --blue:#1769aa; --amber:#9a6700; }
    * { box-sizing:border-box; } body { margin:0; background:var(--wash); color:var(--ink); font:14px/1.45 Inter,"Segoe UI",Arial,sans-serif; }
    header { min-height:58px; background:var(--paper); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 28px; position:sticky; top:0; z-index:3; }
    h1 { font-size:18px; margin:0; } .runtime { color:var(--muted); font-size:12px; }
    nav { background:var(--paper); border-bottom:1px solid var(--line); padding:0 28px; display:flex; gap:22px; overflow:auto; }
    nav button { border:0; border-bottom:2px solid transparent; background:none; padding:13px 0 11px; color:var(--muted); cursor:pointer; white-space:nowrap; font:inherit; }
    nav button.active { color:var(--ink); border-color:var(--green); font-weight:600; }
    main { max-width:1180px; margin:0 auto; padding:24px 28px 48px; }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:var(--paper); margin-bottom:22px; }
    .metric { padding:16px 18px; border-right:1px solid var(--line); } .metric:last-child{border:0}
    .metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:12px}
    section { display:none; } section.active { display:block; }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; }
    h2 { font-size:16px; margin:0; } h3 { font-size:14px; margin:0 0 12px; }
    .panel { background:var(--paper); border:1px solid var(--line); padding:20px; } .panel + .panel { margin-top:14px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px 20px; }
    .grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    label { display:grid; gap:6px; color:var(--muted); font-size:12px; }
    input,select,textarea { width:100%; border:1px solid #bfc8c1; background:#fff; padding:0 10px; color:var(--ink); font:inherit; }
    input,select { height:38px; } textarea { min-height:90px; padding:10px; font:12px/1.45 ui-monospace,Consolas,monospace; }
    input:focus,select:focus,textarea:focus { outline:2px solid #9fd3ba; border-color:var(--green); }
    .secret-field { display:flex; align-items:stretch; } .secret-field input { border-right:0; min-width:0; }
    .secret-toggle { width:40px; border:1px solid #bfc8c1; background:#fff; color:var(--muted); cursor:pointer; flex:0 0 40px; }
    button.action { border:1px solid #aab5ad; background:#fff; min-height:34px; padding:0 12px; cursor:pointer; color:var(--ink); font:inherit; }
    button.action:hover { background:#f8f9f8; } button.primary { background:var(--green); color:#fff; border-color:var(--green); }
    button.primary:hover { background:#10653d; } button.danger { color:var(--red); border-color:#efb3ad; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    table { width:100%; border-collapse:collapse; background:var(--paper); border:1px solid var(--line); }
    th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { background:#f8f9f8; color:var(--muted); font-size:12px; font-weight:600; }
    td code { font-size:12px; color:var(--blue); }
    .ok { color:var(--green); }.bad{color:var(--red)}
    .empty{padding:34px;text-align:center;color:var(--muted)}.table-wrap{overflow:auto}
    .log { margin:0; min-height:160px; max-height:320px; overflow:auto; background:#111b14; color:#dbe7df; padding:12px; font:12px/1.55 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
    .status-line { color:var(--muted); min-height:20px; }
    #toast { position:fixed; right:22px; bottom:22px; max-width:420px; padding:11px 14px; background:#17211b; color:white; display:none; z-index:5; }
    @media(max-width:760px){ header,nav{padding-left:16px;padding-right:16px} main{padding:18px 14px} .metrics{grid-template-columns:1fr 1fr} .grid,.grid.three{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header><h1>LongCat2API</h1><span class="runtime" id="runtime">Node.js · SQLite · session-only</span></header>
  <nav>
    <button class="active" data-tab="accounts">账号</button>
    <button data-tab="register">注册</button>
    <button data-tab="renewals">保活</button>
    <button data-tab="sessions">会话</button>
    <button data-tab="mail">临时邮箱</button>
    <button data-tab="proxy">代理</button>
    <button data-tab="api">API / 打码</button>
    <button data-tab="test">接口测试</button>
  </nav>
  <main>
    <div class="metrics">
      <div class="metric"><b id="mAccounts">-</b><span>有效账号</span></div>
      <div class="metric"><b id="mDue">-</b><span>待保活</span></div>
      <div class="metric"><b id="mSessions">-</b><span>粘性会话</span></div>
      <div class="metric"><b id="mQueue">-</b><span>请求队列</span></div>
    </div>
    <section id="accounts" class="active">
      <div class="bar"><h2>账号池</h2><div class="actions"><button class="action" onclick="loadAll()">刷新</button></div></div>
      <div class="panel">
        <h3>导入 Cookie</h3>
        <div class="grid">
          <label style="grid-column:1/-1">Cookie（需含 passport_token_key）<textarea id="cookieInput" placeholder="_lxsdk_cuid=...; passport_token_key=...; _lxsdk_s=..."></textarea></label>
          <label>备注名<input id="cookieName" placeholder="可选"></label>
          <label>邮箱<input id="cookieEmail" placeholder="可选"></label>
        </div>
        <div class="actions" style="margin-top:12px"><button class="action primary" onclick="importCookie()">导入并探测</button></div>
      </div>
      <div class="table-wrap" style="margin-top:14px">
        <table><thead><tr><th>#</th><th>ID</th><th>邮箱</th><th>状态</th><th>最近保活</th><th>操作</th></tr></thead><tbody id="accountRows"></tbody></table>
      </div>
    </section>
    <section id="register">
      <div class="bar"><h2>注册机</h2>
        <div class="actions">
          <button class="action" onclick="saveRegisterSettings()">保存设置</button>
          <button class="action primary" onclick="startBatch()">批量注册</button>
          <button class="action" onclick="registerOne()">单次注册</button>
        </div>
      </div>
      <div class="panel grid three">
        <label>成功目标<input id="regTarget" type="number" min="0" max="50" value="1"></label>
        <label>最大尝试（≤3 建议）<input id="regCount" type="number" min="1" max="10" value="3"></label>
        <label>并发<input id="regConcurrent" type="number" min="1" max="2" value="1"></label>
        <label>OTP 超时秒<input id="regOtpTimeout" type="number" min="30" max="600" value="240"></label>
        <label>浏览器引擎<select id="regEngine"><option value="camoufox">Camoufox</option><option value="patchright">Patchright</option></select></label>
        <label>AI 打码就绪<input id="regCaptchaReady" readonly></label>
      </div>
      <div class="panel"><h3>任务日志</h3><div id="batchStatus" class="status-line">没有运行中的任务</div><pre class="log" id="registerLog">等待任务</pre></div>
    </section>
    <section id="renewals">
      <div class="bar"><h2>保活队列</h2><button class="action primary" onclick="queueRenewals()">立即保活全部</button></div>
      <div class="panel grid">
        <label>运行状态<input id="rRunning" readonly></label>
        <label>间隔秒<input id="rInterval" readonly></label>
        <label>下次任务<input id="rNext" readonly></label>
        <label>队列<input id="rQueue" readonly></label>
      </div>
      <div class="panel"><h3>最近结果</h3><pre class="log" id="renewLog">—</pre></div>
    </section>
    <section id="sessions">
      <div class="bar"><h2>会话粘性 / 并发 / 压缩</h2><button class="action primary" onclick="saveSession()">保存</button></div>
      <div class="panel grid">
        <label>启用粘性<select id="sessSticky"><option value="true">是</option><option value="false">否</option></select></label>
        <label>每账号并发<input id="sessConc" type="number" min="1" max="8"></label>
        <label>队列上限<input id="sessQueue" type="number" min="1" max="10000"></label>
        <label>排队超时 ms<input id="sessTimeout" type="number" min="1000"></label>
        <label>压缩阈值 tokens<input id="sessCompact" type="number" min="8000"></label>
        <label>会话 TTL 秒<input id="sessTtl" type="number" min="3600"></label>
      </div>
      <div class="panel grid">
        <label>活跃会话<input id="sessActive" readonly></label>
        <label>累计 prompt tokens<input id="sessTokens" readonly></label>
        <label>协调器 active<input id="coordActive" readonly></label>
        <label>协调器 queued<input id="coordQueued" readonly></label>
      </div>
      <p class="status-line">客户端可传 session_id / user / Header X-Session-Id 固定账号与 conversation。</p>
    </section>
    <section id="mail">
      <div class="bar"><h2>临时邮箱</h2><div class="actions"><button class="action" onclick="testMail()">测试</button><button class="action primary" onclick="saveMail()">保存</button></div></div>
      <div class="panel grid">
        <label>API 地址<input id="mailBase"></label>
        <label>管理口令<div class="secret-field"><input id="mailAdmin" type="password"><button class="secret-toggle" type="button" data-target="mailAdmin">👁</button></div></label>
        <label>默认域名<input id="mailDomain"></label>
        <label>站点口令<div class="secret-field"><input id="mailSite" type="password"><button class="secret-toggle" type="button" data-target="mailSite">👁</button></div></label>
      </div>
    </section>
    <section id="proxy">
      <div class="bar"><h2>代理池</h2><div class="actions"><button class="action" onclick="testProxy()">测活</button><button class="action primary" onclick="saveProxy()">保存</button></div></div>
      <div class="panel grid">
        <label>启用<select id="proxyEnabled"><option value="true">是</option><option value="false">否</option></select></label>
        <label>状态<input id="proxyStatus" readonly></label>
        <label style="grid-column:1/-1">订阅地址<div class="secret-field"><input id="proxySub" type="password"><button class="secret-toggle" type="button" data-target="proxySub">👁</button></div></label>
      </div>
    </section>
    <section id="api">
      <div class="bar"><h2>访问与 AI 打码兜底</h2><button class="action primary" onclick="saveApi()">保存</button></div>
      <div class="panel grid">
        <label>API Keys<div class="secret-field"><input id="apiKeys" type="password"><button class="secret-toggle" type="button" data-target="apiKeys">👁</button></div></label>
        <label>管理密码<div class="secret-field"><input id="adminPassword" type="password"><button class="secret-toggle" type="button" data-target="adminPassword">👁</button></div></label>
        <label>保活间隔秒<input id="keepaliveInterval" type="number" min="300"></label>
        <label>默认模式<input id="defaultMode" value="session" readonly></label>
      </div>
      <div class="panel grid">
        <label>启用 AI 打码<select id="captchaAiEnabled"><option value="false">否</option><option value="true">是</option></select></label>
        <label>模型<input id="captchaAiModel" placeholder="grok"></label>
        <label style="grid-column:1/-1">API 地址<input id="captchaAiBase" placeholder="https://grok2api-direct.mnnu.eu.org"></label>
        <label style="grid-column:1/-1">API Key<div class="secret-field"><input id="captchaAiKey" type="password"><button class="secret-toggle" type="button" data-target="captchaAiKey">👁</button></div></label>
      </div>
    </section>
    <section id="test">
      <div class="bar"><h2>OpenAI 协议测试</h2><button class="action primary" onclick="runChatTest()">发送 chat/completions</button></div>
      <div class="panel grid">
        <label>模型<input id="testModel" value="longcat-flash"></label>
        <label>session_id（粘性）<input id="testSession" placeholder="可选"></label>
        <label style="grid-column:1/-1">消息<textarea id="testPrompt">你好，用一句话介绍自己</textarea></label>
      </div>
      <div class="panel"><pre class="log" id="testLog">—</pre></div>
    </section>
  </main>
  <div id="toast"></div>
  <script>
    let config = {}, activeJobId = '';
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const toast = (m, bad=false) => { const e=$('toast'); e.textContent=m; e.style.background=bad?'#b42318':'#17211b'; e.style.display='block'; setTimeout(()=>e.style.display='none', 3800); };
    const api = async (url, opt={}) => {
      const headers = { ...(opt.headers||{}) };
      if (opt.body !== undefined && !Object.keys(headers).some(k => k.toLowerCase()==='content-type')) headers['Content-Type']='application/json';
      const r = await fetch(url, { ...opt, headers });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(j.error?.message || j.error || j.detail || j.message || r.statusText);
      return j;
    };
    document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
      document.querySelectorAll('nav button, section').forEach(e => e.classList.remove('active'));
      b.classList.add('active'); $(b.dataset.tab).classList.add('active');
    });
    document.addEventListener('click', e => {
      const btn = e.target.closest('.secret-toggle'); if (!btn) return;
      const input = $(btn.dataset.target); if (input) input.type = input.type === 'password' ? 'text' : 'password';
    });
    async function loadAll() {
      try {
        config = await api('/api/config');
        applyForms();
        const a = await api('/api/accounts');
        const list = a.accounts || [];
        const valid = list.filter(x => x.is_valid).length;
        $('mAccounts').textContent = valid + '/' + list.length;
        $('accountRows').innerHTML = list.length ? list.map((x,i) =>
          '<tr data-id="'+esc(x.id)+'"><td>'+(i+1)+'</td><td><code>'+esc(x.id)+'</code></td><td>'+esc(x.email||'-')+'</td>'+
          '<td class="'+(x.is_valid?'ok':'bad')+'">'+(x.is_valid?'有效':'无效')+(x.enabled?'':' · 停用')+'</td>'+
          '<td>'+(x.last_renew_at?new Date(x.last_renew_at).toLocaleString():'-')+'</td>'+
          '<td><div class="actions">'+
            '<button class="action" data-act="test">探测</button>'+
            '<button class="action" data-act="renew">保活</button>'+
            '<button class="action danger" data-act="del">删除</button>'+
          '</div></td></tr>').join('') : '<tr><td colspan="6" class="empty">暂无账号 — 导入 Cookie 或运行注册</td></tr>';
        await loadRuntime();
      } catch (e) { toast(e.message, true); }
    }
    function applyForms() {
      const m = config.temp_mail||{}, p=config.proxy_pool||{}, c=config.captcha_ai||{}, s=config.session||{};
      $('mailBase').value=m.api_base||''; $('mailAdmin').value=m.admin_password||'';
      $('mailDomain').value=m.domain||''; $('mailSite').value=m.site_password||'';
      $('proxyEnabled').value=String(!!p.enabled); $('proxySub').value=p.sub_url||'';
      $('proxyStatus').value=(p.status&&p.status.status)||'-';
      $('apiKeys').value=config.api_keys||''; $('adminPassword').value=config.admin_password||'';
      $('keepaliveInterval').value=config.keepalive_interval_seconds||21600;
      $('captchaAiEnabled').value=String(!!c.enabled); $('captchaAiBase').value=c.api_base||'';
      $('captchaAiKey').value=c.api_key||''; $('captchaAiModel').value=c.model||'grok';
      $('regTarget').value=m.success_target??1; $('regCount').value=m.batch_count??3;
      $('regConcurrent').value=m.concurrent??1; $('regOtpTimeout').value=m.otp_timeout??240;
      $('sessSticky').value=String(s.sticky!==false); $('sessConc').value=s.max_concurrency_per_account??1;
      $('sessQueue').value=s.queue_limit??200; $('sessTimeout').value=s.queue_timeout_ms??120000;
      $('sessCompact').value=s.compact_threshold_tokens??80000; $('sessTtl').value=s.ttl_seconds??259200;
    }
    async function loadRuntime() {
      try {
        const p = await api('/api/pool/status');
        const k = p.keepalive||{}; const sess=p.sessions||{}; const coord=p.coordinator||{};
        $('mDue').textContent = k.due ?? '-';
        $('mSessions').textContent = sess.active_sessions ?? 0;
        $('mQueue').textContent = (coord.queued??0) + '/' + (coord.active??0);
        $('rRunning').value = k.running ? '运行中' : '空闲';
        $('rInterval').value = k.interval_seconds ?? '-';
        $('rNext').value = k.nextAt ? new Date(k.nextAt).toLocaleString() : '-';
        $('rQueue').value = '待处理 '+(k.due||0)+' · 失败 '+(k.failed||0);
        $('renewLog').textContent = (k.last_results||[]).map(r =>
          '['+(r.ok?'ok':'fail')+'] '+(r.id||'')+' '+(r.email||'')+' '+(r.detail||'')).join('\n') || '—';
        $('sessActive').value = sess.active_sessions??0;
        $('sessTokens').value = sess.total_prompt_tokens??0;
        $('coordActive').value = coord.active??0;
        $('coordQueued').value = coord.queued??0;
        const reg = await api('/api/registration/status');
        $('regCaptchaReady').value = reg.captcha_ai_ready ? '已配置' : '未配置';
        $('runtime').textContent = 'Node.js · SQLite · ' + (reg.browser_engine||'camoufox');
      } catch (e) {}
    }
    async function importCookie() {
      try {
        const j = await api('/api/account/import-cookie', { method:'POST', body: JSON.stringify({
          cookie: $('cookieInput').value, name: $('cookieName').value, email: $('cookieEmail').value
        })});
        toast(j.ok ? '导入成功' : (j.detail||'已保存'), !j.ok);
        await loadAll();
      } catch(e){ toast(e.message,true); }
    }
    async function accTest(id){ try{ const j=await api('/api/account/'+id+'/test',{method:'POST',body:'{}'}); toast(j.ok?'探测成功':j.detail||'失败',!j.ok); await loadAll(); }catch(e){toast(e.message,true)} }
    async function accRenew(id){ try{ const j=await api('/api/account/'+id+'/renew',{method:'POST',body:'{}'}); toast(j.ok?'保活成功':j.detail||'失败',!j.ok); await loadAll(); }catch(e){toast(e.message,true)} }
    async function accDel(id){ if(!confirm('删除账号 '+id+'？'))return; try{ await api('/api/account/'+id,{method:'DELETE'}); toast('已删除'); await loadAll(); }catch(e){toast(e.message,true)} }
    async function queueRenewals(){ try{ const j=await api('/api/accounts/renew-all',{method:'POST'}); toast('保活完成 ok='+(j.okCount??'-')); await loadAll(); }catch(e){toast(e.message,true)} }
    async function saveMail(){ try{ await api('/api/temp-mail/config',{method:'POST',body:JSON.stringify({api_base:$('mailBase').value,admin_password:$('mailAdmin').value,domain:$('mailDomain').value,site_password:$('mailSite').value})}); toast('已保存'); }catch(e){toast(e.message,true)} }
    async function testMail(){ try{ const j=await api('/api/temp-mail/test',{method:'POST'}); toast(j.test_address?('测试邮箱 '+j.test_address):'连接成功'); }catch(e){toast(e.message,true)} }
    async function saveProxy(){ try{ await api('/api/proxy-pool/config',{method:'POST',body:JSON.stringify({enabled:$('proxyEnabled').value==='true',sub_url:$('proxySub').value})}); toast('已保存'); await loadRuntime(); }catch(e){toast(e.message,true)} }
    async function testProxy(){ try{ const j=await api('/api/proxy-pool/test',{method:'POST',body:'{}'}); toast(j.ok?'代理可用':'代理不可用',!j.ok); }catch(e){toast(e.message,true)} }
    async function saveApi(){
      try{
        await api('/api/config',{method:'POST',body:JSON.stringify({
          api_keys:$('apiKeys').value, admin_password:$('adminPassword').value,
          keepalive_interval_seconds:Number($('keepaliveInterval').value),
          captcha_ai:{ enabled:$('captchaAiEnabled').value==='true', api_base:$('captchaAiBase').value, api_key:$('captchaAiKey').value, model:$('captchaAiModel').value }
        })});
        toast('已保存');
      }catch(e){toast(e.message,true)}
    }
    async function saveSession(){
      try{
        await api('/api/config',{method:'POST',body:JSON.stringify({ session:{
          sticky:$('sessSticky').value==='true', max_concurrency_per_account:Number($('sessConc').value),
          queue_limit:Number($('sessQueue').value), queue_timeout_ms:Number($('sessTimeout').value),
          compact_threshold_tokens:Number($('sessCompact').value), ttl_seconds:Number($('sessTtl').value)
        }})});
        toast('会话设置已保存'); await loadRuntime();
      }catch(e){toast(e.message,true)}
    }
    async function saveRegisterSettings(){
      try{
        const m={...(config.temp_mail||{}), success_target:Number($('regTarget').value), batch_count:Number($('regCount').value), concurrent:Number($('regConcurrent').value), otp_timeout:Number($('regOtpTimeout').value)};
        await api('/api/config',{method:'POST',body:JSON.stringify({temp_mail:m})});
        toast('注册设置已保存');
      }catch(e){toast(e.message,true)}
    }
    async function registerOne(){
      try{
        $('batchStatus').textContent='单次注册启动中…';
        const j=await api('/api/account/auto-register',{method:'POST',body:JSON.stringify({})});
        $('batchStatus').textContent=j.message||'后台运行中';
        if(j.job_id){ activeJobId=j.job_id; pollJob(); }
        toast('已启动单次注册');
      }catch(e){ toast(e.message,true); }
    }
    async function startBatch(){
      try{
        await saveRegisterSettings();
        const j=await api('/api/account/auto-register-batch',{method:'POST',body:JSON.stringify({
          success_target:Number($('regTarget').value), max_attempts:Number($('regCount').value), concurrent:Number($('regConcurrent').value)
        })});
        activeJobId=j.job_id||j.id; renderJob(j); pollJob(); toast('批量注册已启动');
      }catch(e){toast(e.message,true)}
    }
    async function pollJob(){
      if(!activeJobId) return;
      try{
        const j=await api('/api/account/auto-register-batch/'+activeJobId);
        renderJob(j);
        if(['running','pending','stopping'].includes(j.status)) setTimeout(pollJob, 3500);
        else { activeJobId=''; await loadAll(); }
      }catch(e){ toast(e.message,true); activeJobId=''; }
    }
    function renderJob(j){
      $('batchStatus').textContent = (j.message||j.status||'') + ' · 成功 '+(j.success_count??j.success??0)+' · 失败 '+(j.fail_count??j.failed??0);
      const logs = j.logs||[];
      $('registerLog').textContent = logs.map(x => {
        if (typeof x === 'string') return x;
        return '['+(x.t?new Date(x.t).toLocaleTimeString():'-')+'] '+(x.msg||x.message||JSON.stringify(x));
      }).join('\n') || '等待日志';
      $('registerLog').scrollTop = $('registerLog').scrollHeight;
    }
    async function runChatTest(){
      try{
        const key = ($('apiKeys').value||'').split(',')[0].trim() || 'sk-longcat';
        const body = { model:$('testModel').value, messages:[{role:'user',content:$('testPrompt').value}], stream:false };
        if ($('testSession').value) body.session_id = $('testSession').value;
        $('testLog').textContent = '请求中…';
        const r = await fetch('/v1/chat/completions', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key}, body:JSON.stringify(body) });
        const j = await r.json();
        $('testLog').textContent = JSON.stringify(j, null, 2);
        toast(r.ok?'完成':'失败', !r.ok);
      }catch(e){ $('testLog').textContent=e.message; toast(e.message,true); }
    }
    document.getElementById('accountRows').onclick = (e) => {
      const btn = e.target.closest('button[data-act]'); if (!btn) return;
      const tr = btn.closest('tr[data-id]'); if (!tr) return;
      const id = tr.getAttribute('data-id'); const act = btn.getAttribute('data-act');
      if (act==='test') accTest(id); else if (act==='renew') accRenew(id); else if (act==='del') accDel(id);
    };
    loadAll(); setInterval(loadRuntime, 15000);
  </script>
</body>
</html>
